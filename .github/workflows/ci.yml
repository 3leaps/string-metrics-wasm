name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  # Quick validation job (runs first, fails fast)
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1

      - name: Install dependencies
        run: npm ci

      - name: Doc hygiene
        shell: bash
        run: bash scripts/check-doc-hygiene.sh

      - name: Version sync check
        run: make version-check

      - name: License compliance check
        run: npm run license:check

  # Build and test matrix (Ubuntu, macOS, Windows)
  test:
    name: Test (${{ matrix.os }}, node ${{ matrix.node }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: make format-check

      - name: Lint
        run: make lint

      - name: Rust format check
        run: cargo fmt -- --check

      - name: Rust clippy
        run: make rust-clippy

      - name: Build WASM
        run: npm run build:wasm

      - name: Build TypeScript
        run: npm run build:ts

      - name: Type check
        run: make typecheck

      - name: Run tests
        run: npm test

      - name: Check package contents
        # Pin to bash: Windows runners default to PowerShell, which can't parse
        # this script's shell control flow.
        shell: bash
        run: |
          contents=$(npm pack --dry-run 2>&1)
          echo "$contents"
          echo "$contents" | grep -q "dist/wasm-inline.js" || (echo "❌ Embedded WASM (dist/wasm-inline.js) missing from package" && exit 1)
          echo "$contents" | grep -q "pkg/web/string_metrics_wasm.js" || (echo "❌ WASM JS glue (pkg/web/string_metrics_wasm.js) missing from package" && exit 1)
          if echo "$contents" | grep -qE "string_metrics_wasm_bg\.wasm$"; then
            echo "❌ Redundant raw .wasm should not be published (it is embedded in dist/wasm-inline.js)" && exit 1
          fi
          echo "✅ Package contains embedded WASM + JS glue; redundant raw .wasm excluded"

  # Release job (only on tags)
  release:
    name: Create Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1

      - name: Install dependencies
        run: npm ci

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${{ steps.version.outputs.VERSION }}"
          if [ "$PKG" != "$TAG" ]; then
            echo "❌ Tag v$TAG does not match package.json version $PKG" && exit 1
          fi
          echo "✅ Tag matches package.json version: $PKG"

      - name: Verify release notes exist
        run: |
          NOTES="docs/releases/v${{ steps.version.outputs.VERSION }}.md"
          test -f "$NOTES" || { echo "❌ Release notes not found: $NOTES" && exit 1; }
          echo "✅ Release notes found: $NOTES"

      - name: Build
        run: make build

      - name: Create package tarball
        run: npm pack

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: 3leaps-string-metrics-wasm-${{ steps.version.outputs.VERSION }}.tgz
          fail_on_unmatched_files: true
          body_path: docs/releases/v${{ steps.version.outputs.VERSION }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
